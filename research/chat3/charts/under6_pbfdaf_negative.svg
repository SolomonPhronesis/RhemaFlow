<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" role="img" aria-label="Causal PBFDAF: negative safety evidence retained"><style>text{font-family:Arial,sans-serif;fill:#24334a;font-size:15px}.title{font-size:21px;font-weight:700}.note{font-size:13px;fill:#566274}</style><rect width="100%" height="100%" fill="#f8fafc" rx="12"/><text x="24" y="34" class="title">Causal PBFDAF: negative safety evidence retained</text><text x="24" y="59" class="note">A small interference gain did not preserve target quality; do not integrate.</text><line x1="790" x2="790" y1="78" y2="250" stroke="#9caabc"/><text x="24" y="115">ΔSIR vs close-only</text><rect x="790.00" y="95" width="35.49" height="29" fill="#b0712b"/><line x1="821.70" x2="829.10" y1="109" y2="109" stroke="#182536" stroke-width="3"/><text x="260" y="141" class="note">+0.789 dB [+0.704, +0.869]</text><text x="24" y="174">ΔSI-SDR vs close-only</text><rect x="744.64" y="154" width="45.36" height="29" fill="#b44e47"/><line x1="741.92" x2="748.19" y1="168" y2="168" stroke="#182536" stroke-width="3"/><text x="260" y="200" class="note">-1.008 dB [-1.068, -0.929]</text><text x="24" y="233">Target-loss stress case</text><rect x="351.55" y="213" width="438.45" height="29" fill="#b44e47"/><text x="260" y="259" class="note">-9.743 dB · single stress case, no CI</text><text x="24" y="303" class="note">Prior procedural signals · paired 95% CIs / 10 source clusters, 2,000 resamples · not speech, WER or card evidence.</text></svg>